name: release

# 打 v* 形式的 tag 时触发：GoReleaser 构建多平台产物并发布到 GitHub Releases。
# 手动触发（workflow_dispatch）默认走 --snapshot，便于在不打 tag 的情况下验证发布链路。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "以 snapshot 方式构建（不创建 Release）"
        type: boolean
        default: true

permissions:
  contents: write # 创建 Release、上传产物所需

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser 需要完整历史与 tag 生成 changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 私有依赖 pkg.blksails.net/yamuxproxy 是 vanity 路径，解析到私有仓库
      # github.com/blksails/yamuxproxy。go 先从 pkg.blksails.net 取 go-import 元信息
      # （公开 HTTPS），再 clone github.com/blksails/* 私有仓库。
      #
      # 默认的 GITHUB_TOKEN 仅能访问当前仓库（blksails/cli），无法 clone 同组织的其它
      # 私有仓库；因此需在仓库 Secrets 配置一个有 blksails 组织 repo 读权限的 PAT：GH_PAT。
      # 用 token 重写 https://github.com/ 为带凭据的形式，并把这两类路径标记为 GOPRIVATE，
      # 跳过公共 proxy/sumdb 校验。如未来所有依赖均公开，可删除本步及 GH_PAT。
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=pkg.blksails.net/*,github.com/blksails/*" >> "$GITHUB_ENV"

      - name: Run GoReleaser (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify OSS release credentials
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          if [[ -z "$OSS_ACCESS_KEY_ID" || -z "$OSS_ACCESS_KEY_SECRET" ]]; then
            echo "Missing ALIYUN_OSS_ACCESS_KEY_ID or ALIYUN_OSS_ACCESS_KEY_SECRET." >&2
            exit 1
          fi

      - name: Install pinned ossutil
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          OSSUTIL_VERSION: 2.3.0
          OSSUTIL_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a
        run: |
          archive="ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/$archive"
          echo "$OSSUTIL_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/ossutil"
          install -m 0755 \
            "$RUNNER_TEMP/ossutil/ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" \
            "$RUNNER_TEMP/ossutil-bin"
          echo "OSSUTIL=$RUNNER_TEMP/ossutil-bin" >> "$GITHUB_ENV"

      - name: Publish release mirror to Aliyun OSS
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-hangzhou
          OSS_BUCKET: blksails-pi-desktop
        run: scripts/publish-oss.sh "${GITHUB_REF_NAME}" dist

      - name: Run GoReleaser (snapshot)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: bk-snapshot
          path: dist/*
          retention-days: 7
